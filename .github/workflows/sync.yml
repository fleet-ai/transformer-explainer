# Retained path replaces the upstream automatic merge workflow for this adaptation.
name: MoE Explainer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Full upstream Svelte type-check has pre-existing errors; compile and test the adaptation.
      - run: npm test
      - run: npm run validate:traces
      - run: npm run build
